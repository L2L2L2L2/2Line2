<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천교통공사 역사 부착물 모바일 안내</title>
  <!-- 무료 오픈소스 QR코드 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* 공통 인천교통공사 가이드 규격 */
    body { font-family: "맑은 고딕", Malgun Gothic, sans-serif; margin: 0; background: #f4f5f7; }
    
    /* 1. 모바일 승객 화면 스타일 */
    #mobile-view { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .theme-bar { height: 8px; width: 100%; }
    .content-box { padding: 30px 20px; text-align: center; }
    .title { font-size: 26px; font-weight: bold; margin-bottom: 20px; word-break: keep-all; }
    .icon-area { font-size: 60px; margin: 25px 0; }
    .desc { font-size: 16px; color: #333; line-height: 1.6; word-break: keep-all; }
    .footer { padding: 15px; border-top: 1px solid #eee; text-align: center; font-size: 14px; background: #fafafa; }
    .call-btn { display: inline-block; margin-top: 8px; padding: 6px 14px; background: #0091AA; color: #fff; text-decoration: none; border-radius: 20px; font-weight: bold; }

    /* 2. 관리자 작성/인쇄 모드 스타일 (화면 분기용) */
    #admin-view { max-width: 800px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; }
    .form-group { margin-bottom: 12px; }
    label { font-weight: bold; display: block; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    
    /* 인쇄 시 A4 가로 설정 */
    @media print {
      body { background: #fff; }
      #admin-view { display: none; }
      #print-area { display: block !important; width: 100%; }
    }
  </style>
</head>
<body>

  <!-- (A) 직원용 작성기 (URL 파라미터가 없을 때 표시) -->
  <div id="admin-view">
    <h2>역사 안내문 생성 및 인쇄 관리</h2>
    <div class="form-group">
      <label>이전 작성물 불러오기 (수정용 QR 링크 입력):</label>
      <input type="text" id="load-url" placeholder="이전에 복사해둔 링크를 붙여넣으면 내용이 복원됩니다.">
      <button type="button" onclick="loadPreviousData()" style="margin-top:5px;">불러오기</button>
    </div>
    <hr>
    <div class="form-group">
      <label>자주 쓰는 양식 템플릿 선택:</label>
      <select id="tpl-select" onchange="applyTemplate()">
        <option value="">직접 입력</option>
        <option value="time">열차 운행 시간표 변경 안내</option>
        <option value="transfer">환승 통로 안내</option>
        <option value="repair">시설물 수리/점검 안내</option>
      </select>
    </div>
    <div class="form-group">
      <label>안내 분류 (가이드 기준):</label>
      <select id="notice-type">
        <option value="#2563EB">1. 안내/정보 (파란색)</option>
        <option value="#0091AA">2. 방향/동선 (청록색)</option>
        <option value="#16A34A">3. 안전/재난 (녹색)</option>
        <option value="#DC2626">4. 경고/금지 (빨간색)</option>
      </select>
    </div>
    <div class="form-group">
      <label>핵심 제목:</label>
      <input type="text" id="notice-title" value="열차 운행 시간표 변경 안내">
    </div>
    <div class="form-group">
      <label>상세 안내 문구:</label>
      <textarea id="notice-desc" rows="3">임시 열차 증편 운행에 따라 막차 운행 시간이 변경됨을 알려드립니다.</textarea>
    </div>
    <div class="form-group">
      <label>역명 및 연락처:</label>
      <input type="text" id="station-name" value="송도달빛축제공원역 (032-451-3139)">
    </div>
    <button onclick="generateQRAndPrint()" style="padding: 10px 20px; font-size:16px; background:#0078d4; color:#fff; border:none; cursor:pointer;">
      QR 생성 및 인쇄하기
    </button>
  </div>

  <!-- (B) 승객용 모바일 화면 (QR 스캔 시 표시) -->
  <div id="mobile-view" style="display:none;">
    <div>
      <div id="m-bar" class="theme-bar"></div>
      <div class="content-box">
        <div id="m-title" class="title"></div>
        <div id="m-icon" class="icon-area">📢</div>
        <div id="m-desc" class="desc"></div>
      </div>
    </div>
    <div class="footer">
      <div id="m-station"></div>
      <a id="m-call" href="#" class="call-btn">역무실 전화 연결</a>
    </div>
  </div>

  <script>
    // 1. URL 확인 (승객이 QR을 찍고 들어온 경우)
    window.onload = function() {
      const hash = window.location.hash.substring(1);
      if (hash) {
        // 모바일 승객 모드로 전환
        document.getElementById('admin-view').style.display = 'none';
        document.getElementById('mobile-view').style.display = 'flex';
        
        const data = JSON.parse(decodeURIComponent(escape(atob(hash))));
        document.getElementById('m-bar').style.backgroundColor = data.color;
        document.getElementById('m-title').innerText = data.title;
        document.getElementById('m-title').style.color = data.color;
        document.getElementById('m-desc').innerText = data.desc;
        document.getElementById('m-station').innerText = data.station;
        
        // 전화번호 파싱 (032-... 형태 추출)
        const phone = data.station.match(/[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}/);
        if (phone) {
          document.getElementById('m-call').href = 'tel:' + phone[0];
        }
      }
    };

    // 2. 자주 쓰는 템플릿 자동 채우기
    function applyTemplate() {
      const t = document.getElementById('tpl-select').value;
      if (t === 'time') {
        document.getElementById('notice-type').value = '#2563EB';
        document.getElementById('notice-title').value = '열차 운행 시간표 변경 안내';
        document.getElementById('notice-desc').value = '임시 열차 증편 운행에 따라 막차 운행 시간이 변경됨을 알려드립니다.\n※ 기존 열차 운행시간은 변경사항 없음';
      } else if (t === 'transfer') {
        document.getElementById('notice-type').value = '#0091AA';
        document.getElementById('notice-title').value = '환승 통로 이용 안내';
        document.getElementById('notice-desc').value = '해당 방면 환승 통로는 승강장 6-1칸 앞 에스컬레이터를 이용해 주시기 바랍니다.';
      } else if (t === 'repair') {
        document.getElementById('notice-type').value = '#2563EB';
        document.getElementById('notice-title').value = '시설물 점검 중';
        document.getElementById('notice-desc').value = '현재 승강기 점검 중입니다. 조치 완료 시까지 인근 계단을 이용해 주시기 바랍니다.';
      }
    }

    // 3. QR코드 생성 및 데이터 패키징
    function generateQRAndPrint() {
      const data = {
        color: document.getElementById('notice-type').value,
        title: document.getElementById('notice-title').value,
        desc: document.getElementById('notice-desc').value,
        station: document.getElementById('station-name').value
      };
      
      // 데이터를 Base64로 압축하여 모바일 주소 생성
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
      const targetUrl = window.location.origin + window.location.pathname + '#' + encoded;
      
      // 수정용 링크 알림
      prompt("이 링크를 복사해두면 나중에 그대로 불러와서 수정할 수 있습니다:", targetUrl);
      
      // 인쇄 화면 호출 또는 QR 이미지 생성 로직 실행
    }

    // 4. 이전 작성물 복원 (수정 기능)
    function loadPreviousData() {
      const inputUrl = document.getElementById('load-url').value;
      const hash = inputUrl.split('#')[1];
      if (hash) {
        const data = JSON.parse(decodeURIComponent(escape(atob(hash))));
        document.getElementById('notice-type').value = data.color;
        document.getElementById('notice-title').value = data.title;
        document.getElementById('notice-desc').value = data.desc;
        document.getElementById('station-name').value = data.station;
        alert('이전 작성 내용을 불러왔습니다. 수정 후 다시 인쇄하세요.');
      }
    }
  </script>
</body>
</html>
