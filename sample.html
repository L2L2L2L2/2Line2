<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천교통공사 역사 부착물 제작 시스템</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: "맑은 고딕", "Malgun Gothic", sans-serif; }
    body { margin: 0; background: #e2e8f0; color: #1e293b; padding-bottom: 60px; }

    /* [1] 작성자 패널 */
    #admin-panel { max-width: 920px; margin: 25px auto; background: #fff; padding: 25px 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .form-row { margin-bottom: 14px; }
    label { font-weight: bold; display: block; margin-bottom: 6px; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; outline: none; }
    .btn-group { display: flex; gap: 12px; margin-top: 25px; }
    button { padding: 13px 22px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-print { background: #059669; color: #fff; }
    .btn-sub { background: #475569; color: #fff; padding: 8px 14px; font-size: 13px; }

    .svgrepo-box { background: #f8fafc; border: 2px dashed #94a3b8; padding: 15px; border-radius: 8px; margin-top: 6px; }
    .mobile-only-box { background: #f0fdf4; border: 1.5px solid #86efac; padding: 14px; border-radius: 8px; margin-top: 6px; }

    /* [2] A4 가로 인쇄 포스터 (PDF 원본 완벽 일치 규격) */
    #poster-wrapper { display: none; margin: 30px auto; max-width: 920px; }
    
    #print-poster {
      width: 100%;
      aspect-ratio: 297 / 210;
      background: #fff;
      position: relative;
      /* 상, 좌, 하단 테두리 실선 9px */
      border-top: 9px solid #9EA4AA;
      border-left: 9px solid #9EA4AA;
      border-bottom: 9px solid #9EA4AA;
      border-right: none;
      padding: 30px 45px 25px 45px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden; /* 밖으로 삐져나가는 현상 원천 차단 */
    }

    /* --- [예시 1번 완벽 구현: 우측 테두리 일체형 분할 컬럼] --- */
    .right-border-column {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }
    /* 상단에서 내려오는 실선 */
    .right-line-top {
      width: 9px;
      flex: 1;
      background: #9EA4AA;
    }
    /* 글자가 들어가는 간격 홈 */
    .right-text-slot {
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    /* 표준 세로 조판: 회전 버그 없이 밖으로 절대 안 튀어나감 */
    .right-brand-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      font-size: 13.5px;
      color: #9EA4AA;
      letter-spacing: 0.5px;
      white-space: nowrap;
      line-height: 1;
      display: block;
    }
    /* 하단 모서리에서 올라오는 짧은 실선 */
    .right-line-bottom {
      width: 9px;
      height: 52px;
      background: #9EA4AA;
    }

    /* 좌측 상단 공식 로고 */
    .poster-header { display: flex; align-items: center; min-height: 42px; }
    .official-logo-img { max-height: 38px; width: auto; object-fit: contain; }

    /* 본문 영역 */
    .poster-title-area { text-align: center; margin-top: 10px; }
    .poster-title { font-size: 50px; font-weight: 900; margin: 0; letter-spacing: -2px; }

    .poster-visual-area {
      flex: 1; display: flex; justify-content: center; align-items: center; margin: 15px 0; min-height: 180px;
    }
    .poster-visual-area svg, .poster-visual-area img {
      max-height: 190px; max-width: 70%; width: auto; height: auto;
    }

    /* 설명 문구: QR코드와 겹치지 않도록 우측 안전 여백 100px 확보 */
    .poster-desc-area { text-align: center; margin-bottom: 10px; padding: 0 100px; }
    .poster-desc { font-size: 22px; line-height: 1.5; color: #1e293b; font-weight: bold; white-space: pre-line; word-break: keep-all; }

    /* 하단 고정 영역 */
    .poster-footer {
      display: flex; justify-content: center; align-items: center;
      position: relative; min-height: 85px;
    }
    .footer-center {
      display: flex; align-items: center; gap: 10px;
      font-size: 23px; font-weight: 900; color: #0f172a;
    }
    .footer-logo-img { max-height: 30px; width: auto; }
    
    /* QR코드 영역 */
    .qr-container {
      position: absolute; right: 0; bottom: 0; text-align: center;
    }
    #poster-qr {
      background: #ffffff;
      padding: 5px;
      border: 1px solid #cbd5e1;
      display: inline-block;
      line-height: 0;
    }
    #poster-qr img, #poster-qr canvas {
      width: 85px !important;
      height: 85px !important;
    }
    .qr-label { font-size: 11px; color: #475569; margin-top: 4px; font-weight: bold; }

    /* [3] 모바일 승객 전용 화면 */
    #mobile-view { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; display: none; flex-direction: column; justify-content: space-between; border-left: 7px solid #9EA4AA; }
    .m-header { padding: 18px 20px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; }
    .m-content { padding: 30px 20px; text-align: center; }
    .m-title { font-size: 26px; font-weight: 900; margin-bottom: 15px; word-break: keep-all; }
    .m-visual { margin: 20px 0; }
    .m-visual svg, .m-visual img { max-height: 140px; width: auto; }
    .m-desc { font-size: 17px; line-height: 1.6; color: #334155; white-space: pre-line; word-break: keep-all; text-align: left; background: #f8fafc; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; }
    
    #m-extra-box {
      margin-top: 14px; padding: 16px; background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 8px; text-align: left;
    }
    .m-extra-tag { font-size: 13px; font-weight: bold; color: #1d4ed8; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
    #m-extra-text { font-size: 15px; line-height: 1.65; color: #1e293b; white-space: pre-line; word-break: keep-all; margin-bottom: 10px; }
    
    .video-container {
      position: relative; width: 100%; padding-bottom: 56.25%; height: 0;
      margin-top: 10px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .video-container iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }

    .m-footer { padding: 20px; text-align: center; border-top: 1px solid #e2e8f0; background: #fafafa; }
    .tel-btn { display: block; margin-top: 10px; padding: 14px; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; }

    /* [4] 인쇄 전용 스타일 */
    @media print {
      @page { size: A4 landscape; margin: 0; }
      html, body { width: 297mm; height: 210mm; background: #fff; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #admin-panel, #url-copy-box, .btn-group { display: none !important; }
      #poster-wrapper { display: block !important; margin: 0 !important; max-width: none !important; width: 297mm !important; height: 210mm !important; }
      #print-poster {
        width: 297mm !important; height: 210mm !important;
        border-top: 9px solid #9EA4AA !important;
        border-left: 9px solid #9EA4AA !important;
        border-bottom: 9px solid #9EA4AA !important;
        box-shadow: none !important; padding: 15mm 20mm !important;
        page-break-after: avoid;
      }
      .right-border-column { width: 9px !important; }
      .right-line-top, .right-line-bottom { width: 9px !important; }
      .poster-title { font-size: 48px !important; }
      .poster-desc { font-size: 23px !important; }
      .footer-center { font-size: 23px !important; }
      #poster-qr img, #poster-qr canvas { width: 28mm !important; height: 28mm !important; }
    }
  </style>
</head>
<body>

  <!-- 1. 작성 관리자 패널 -->
  <div id="admin-panel">
    <h2 style="margin-top:0; color:#0f172a;">역사 부착물 표준 디자인 제작기</h2>

    <div class="form-row" style="background: #f1f5f9; padding: 14px; border-radius: 6px;">
      <label>이전 작성물 불러오기 (수정용 QR 링크):</label>
      <div style="display:flex; gap:10px;">
        <input type="text" id="load-url" placeholder="이전에 복사해둔 링크를 넣으면 내용이 복원됩니다.">
        <button type="button" class="btn-sub" onclick="loadPreviousData()" style="width:120px;">불러오기</button>
      </div>
    </div>

    <div class="form-row">
      <label>표준 템플릿 선택:</label>
      <select id="tpl-select" onchange="applyTemplate()">
        <option value="ban1">관계자 외 출입금지 (경고/빨강)</option>
        <option value="ban2">자전거·킥보드 운행금지 (경고/빨강)</option>
        <option value="toilet">화장실 안내 (방향/청록)</option>
        <option value="elevator">지상 엘리베이터 (방향/청록)</option>
        <option value="custom">직접 픽토그램 검색해서 넣기</option>
      </select>
    </div>

    <!-- svgrepo.com 검색 및 삽입 섹션 -->
    <div class="form-row">
      <label>중앙 픽토그램 (svgrepo.com 연동 검색):</label>
      <div class="svgrepo-box">
        <div style="display:flex; gap:10px; margin-bottom:10px;">
          <input type="text" id="svg-search-kw" placeholder="영어 검색어 입력 (예: bicycle, elevator, toilet, no entry)">
          <button type="button" class="btn-sub" onclick="openSvgRepo()" style="background:#0284c7; width:180px;">svgrepo에서 찾기 ↗</button>
        </div>
        <textarea id="svg-input-area" rows="3" placeholder="<svg ...> 코드를 여기에 붙여넣거나 다운로드한 .svg 파일을 아래에서 선택하세요." oninput="updateVisualFromInput()"></textarea>
        <div style="margin-top:8px;">
          <input type="file" id="svg-file-input" accept=".svg,image/*" onchange="handleSvgUpload(this)">
        </div>
      </div>
    </div>

    <div class="form-row">
      <label>제목 글자 색상 (가이드 규격):</label>
      <select id="color-code">
        <option value="#DC2626">4. 경고/금지 (빨간색 - R:220 G:38 B:38)</option>
        <option value="#0091AA">2. 방향/시설 (청록색 - R:0 G:145 B:170)</option>
        <option value="#2563EB">1. 안내/정보 (파란색 - R:37 G:99 B:235)</option>
        <option value="#16A34A">3. 안전/재난 (녹색 - R:22 G:163 B:74)</option>
      </select>
    </div>

    <div class="form-row">
      <label>핵심 제목:</label>
      <input type="text" id="doc-title" value="관계자 외 출입금지">
    </div>

    <div class="form-row">
      <label>기본 안내 내용 (종이 포스터 및 모바일에 모두 표시):</label>
      <textarea id="doc-desc" rows="2">용무가 있으신 고객은 고객안내센터로 연락주시기 바랍니다.</textarea>
    </div>

    <div class="form-row">
      <div class="mobile-only-box">
        <label style="color:#15803d; margin-bottom:4px;">
          📱 모바일 전용 추가 상세 안내 (유튜브 링크 넣으면 영상 플레이어로 자동 변환됩니다)
        </label>
        <textarea id="doc-extra" rows="3" placeholder="예: 상세 수칙 설명 및 https://youtu.be/... 링크를 넣으면 영상 플레이어가 모바일 화면에 바로 뜹니다."></textarea>
      </div>
    </div>

    <div class="form-row">
      <label>역명 및 전화번호 (하단 중앙):</label>
      <input type="text" id="doc-station" value="간석오거리역  032-451-3123">
    </div>

    <div class="btn-group">
      <button class="btn-primary" type="button" onclick="generatePoster()">1. 포스터 & 선명한 QR 생성</button>
      <button class="btn-print" type="button" onclick="window.print()">2. A4 가로 인쇄하기</button>
    </div>

    <div id="url-copy-box" style="margin-top:20px; display:none; background:#e0f2fe; padding:12px; border-radius:6px;">
      <label>추후 수정을 위한 보관 링크 (복사해 두세요):</label>
      <input type="text" id="export-url" readonly onclick="this.select()">
    </div>
  </div>

  <!-- 2. A4 가로 인쇄 포스터 -->
  <div id="poster-wrapper">
    <div id="print-poster">

      <!-- 상단 공식 로고 -->
      <div class="poster-header">
        <img src="https://www.ictr.or.kr/main/img/main2025/logo.svg" referrerpolicy="no-referrer" class="official-logo-img" alt="인천교통공사">
      </div>

      <!-- [완벽 수정] 우측 테두리 일체형 분할 영문 컬럼 (튀어나옴 제로) -->
      <div class="right-border-column">
        <div class="right-line-top"></div>
        <div class="right-text-slot">
          <span class="right-brand-text">Incheon Transit Corporation</span>
        </div>
        <div class="right-line-bottom"></div>
      </div>

      <!-- 상단 핵심 제목 -->
      <div class="poster-title-area">
        <div id="p-title" class="poster-title"></div>
      </div>

      <!-- 중앙 픽토그램 비주얼 -->
      <div class="poster-visual-area" id="p-visual"></div>

      <!-- 종이용 간결한 설명 (우측 여백 100px로 QR 침범 차단) -->
      <div class="poster-desc-area">
        <div id="p-desc" class="poster-desc"></div>
      </div>

      <!-- 하단 고정: 공식 로고 + 역명 / QR 우측 -->
      <div class="poster-footer">
        <div class="footer-center">
          <img src="https://www.ictr.or.kr/main/img/main2025/logo.svg" referrerpolicy="no-referrer" class="footer-logo-img" alt="인천교통공사">
          <span id="p-station"></span>
        </div>
        <div class="qr-container">
          <div id="poster-qr"></div>
          <div class="qr-label">모바일 상세안내</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 3. 모바일 승객 전용 화면 -->
  <div id="mobile-view">
    <div>
      <div class="m-header">
        <img src="https://www.ictr.or.kr/main/img/main2025/logo.svg" referrerpolicy="no-referrer" style="max-height:30px; width:auto;" alt="인천교통공사">
      </div>
      <div class="m-content">
        <div id="m-title" class="m-title"></div>
        <div class="m-visual" id="m-visual"></div>
        <div id="m-desc" class="m-desc"></div>

        <div id="m-extra-box" style="display:none;">
          <div class="m-extra-tag">📌 상세 안내 및 관련 영상</div>
          <div id="m-extra-text"></div>
          <div id="m-video-container" style="display:none;" class="video-container"></div>
        </div>
      </div>
    </div>
    <div class="m-footer">
      <div id="m-station" style="font-weight:bold; font-size:15px; color:#334155;"></div>
      <a id="m-call" href="#" class="tel-btn">역무실로 전화 걸기</a>
    </div>
  </div>

  <script>
    var Presets = {
      ban1: {
        title: '관계자 외 출입금지',
        desc: '용무가 있으신 고객은 고객안내센터로 연락주시기 바랍니다.',
        extra: '- 고압 전기설비 및 기계실이 위치하여 감전 및 추락 위험이 있습니다.\n- 업무상 방문 고객은 고객안내센터(역무실)의 승인을 받아 직원의 안내를 받으시기 바랍니다.',
        color: '#DC2626',
        svg: `<svg viewBox="0 0 200 200" width="180" height="180">
          <circle cx="100" cy="100" r="90" fill="none" stroke="#DC2626" stroke-width="16"/>
          <line x1="36" y1="36" x2="164" y2="164" stroke="#DC2626" stroke-width="16"/>
          <circle cx="100" cy="65" r="16" fill="#111"/>
          <path d="M85 90 C85 85, 115 85, 115 90 L115 135 L108 135 L108 165 L92 165 L92 135 L85 135 Z" fill="#111"/>
        </svg>`
      },
      ban2: {
        title: '자전거·킥보드 운행금지',
        desc: '역사 내에서는 개인형 이동장치를 운행하실 수 없습니다.',
        extra: '- 전동 킥보드, 전동 휠 등 개인형 이동장치(PM) 탑승 전면 금지\n- 접이식 자전거는 완전히 접은 상태로만 휴대 가능합니다.\n- 역사 내 안전사고 발생 시 관련 법령에 따라 과태료 및 배상 책임이 발생할 수 있습니다.',
        color: '#DC2626',
        svg: `<svg viewBox="0 0 220 220" width="190" height="190">
          <circle cx="110" cy="110" r="95" fill="none" stroke="#DC2626" stroke-width="18"/>
          <line x1="43" y1="43" x2="177" y2="177" stroke="#DC2626" stroke-width="18"/>
          <g fill="none" stroke="#111" stroke-width="6" stroke-linecap="round">
            <circle cx="70" cy="140" r="24"/>
            <circle cx="150" cy="140" r="24"/>
            <path d="M70 140 L105 100 L140 100 M105 100 L120 140 M92 88 L118 88"/>
            <path d="M165 110 L165 155 L150 155 M155 110 L175 110" stroke-width="5"/>
          </g>
        </svg>`
      },
      toilet: {
        title: '화 장 실',
        desc: '화장실은 1번 출구 앞에 있습니다.',
        extra: '- 1번 출구 에스컬레이터 우측 뒤편 위치\n- 장애인/교통약자 화장실 및 기저귀 교환대 완비\n- 긴급 상황 시 내부 비상벨을 눌러주시면 역무원이 출동합니다.',
        color: '#0091AA',
        svg: `<svg viewBox="0 0 450 200" width="380" height="170">
          <rect x="10" y="10" width="180" height="180" rx="25" fill="#fff" stroke="#111" stroke-width="12"/>
          <line x1="100" y1="25" x2="100" y2="175" stroke="#111" stroke-width="4"/>
          <circle cx="60" cy="55" r="14" fill="#111"/>
          <path d="M48 76 L72 76 L72 120 L66 120 L66 160 L54 160 L54 120 L48 120 Z" fill="#111"/>
          <circle cx="140" cy="55" r="14" fill="#111"/>
          <path d="M130 76 L150 76 L160 125 L144 125 L144 160 L136 160 L136 125 L120 125 Z" fill="#111"/>
          <polygon points="215,65 330,65 330,20 440,100 330,180 330,135 215,135" fill="#111"/>
          <text x="310" y="112" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#fff" text-anchor="middle">30M</text>
        </svg>`
      },
      elevator: {
        title: '지상 엘리베이터',
        desc: '지상 엘리베이터는 5번 출구 앞에 있습니다.',
        extra: '- 지상 5번 출구 방면 횡단보도 바로 앞 위치\n- 휠체어, 유모차, 노약자 및 무거운 짐을 소지하신 승객 우선 이용 권장\n- 승강기 고장 신고는 하단 역무실 번호로 즉시 연락 바랍니다.',
        color: '#0091AA',
        svg: `<svg viewBox="0 0 450 200" width="380" height="170">
          <rect x="10" y="10" width="180" height="180" rx="25" fill="#fff" stroke="#111" stroke-width="12"/>
          <polygon points="80,35 70,50 90,50" fill="#111"/>
          <polygon points="120,50 110,35 130,35" fill="#111"/>
          <circle cx="75" cy="75" r="12" fill="#111"/>
          <path d="M65 92 L85 92 L85 145 L65 145 Z" fill="#111"/>
          <circle cx="125" cy="75" r="12" fill="#111"/>
          <path d="M115 92 L135 92 L140 135 L128 135 L128 155 L122 155 L122 135 L110 135 Z" fill="#111"/>
          <polygon points="215,65 330,65 330,20 440,100 330,180 330,135 215,135" fill="#111"/>
          <text x="310" y="112" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#fff" text-anchor="middle">30M</text>
        </svg>`
      }
    };

    var currentCustomVisual = Presets.ban1.svg;

    function extractYouTubeId(text) {
      var match = text.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/);
      return match ? match[1] : null;
    }

    function openSvgRepo() {
      var kw = document.getElementById('svg-search-kw').value.trim() || 'warning';
      window.open('https://www.svgrepo.com/vectors/' + encodeURIComponent(kw) + '/', '_blank');
    }

    function updateVisualFromInput() {
      var val = document.getElementById('svg-input-area').value.trim();
      if (val) {
        currentCustomVisual = val;
        document.getElementById('p-visual').innerHTML = val;
      }
    }

    function handleSvgUpload(input) {
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var content = e.target.result;
          if (input.files[0].name.endsWith('.svg')) {
            document.getElementById('svg-input-area').value = content;
            currentCustomVisual = content;
          } else {
            currentCustomVisual = '<img src="' + content + '" style="max-height:190px;">';
          }
          document.getElementById('p-visual').innerHTML = currentCustomVisual;
        };
        if (input.files[0].name.endsWith('.svg')) {
          reader.readAsText(input.files[0]);
        } else {
          reader.readAsDataURL(input.files[0]);
        }
      }
    }

    // [A] QR 접속 감지 (모바일 승객 모드)
    window.onload = function() {
      var params = new URLSearchParams(window.location.search);
      if (params.has('id') || params.has('t')) {
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('poster-wrapper').style.display = 'none';
        var mobileView = document.getElementById('mobile-view');
        mobileView.style.display = 'flex';

        var title, desc, extra, color, svg;
        var tplId = params.get('id');

        if (tplId && Presets[tplId]) {
          title = Presets[tplId].title;
          desc = Presets[tplId].desc;
          extra = params.has('m') ? params.get('m') : Presets[tplId].extra;
          color = Presets[tplId].color;
          svg = Presets[tplId].svg;
        } else {
          title = params.get('t') || '';
          desc = params.get('d') || '';
          extra = params.get('m') || '';
          color = params.get('c') || '#0091AA';
          svg = '';
        }

        var station = params.get('st') || '인천교통공사';
        var tel = params.get('tel') || '';

        document.getElementById('m-title').innerText = title;
        document.getElementById('m-title').style.color = color;
        document.getElementById('m-desc').innerText = desc;
        document.getElementById('m-station').innerText = station + (tel ? '  ' + tel : '');
        document.getElementById('m-visual').innerHTML = svg;

        if (extra && extra.trim() !== '') {
          var ytid = extractYouTubeId(extra);
          var cleanText = extra.replace(/(https?:\/\/[^\s]+)/g, '').trim();

          document.getElementById('m-extra-text').innerText = cleanText || '아래 안내 영상을 확인해 주세요.';
          
          if (ytid) {
            var videoBox = document.getElementById('m-video-container');
            videoBox.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + ytid + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
            videoBox.style.display = 'block';
          }
          document.getElementById('m-extra-box').style.display = 'block';
        } else {
          document.getElementById('m-extra-box').style.display = 'none';
        }

        var telBtn = document.getElementById('m-call');
        telBtn.style.backgroundColor = color;
        if (tel) {
          telBtn.href = 'tel:' + tel;
        } else {
          telBtn.style.display = 'none';
        }
      } else {
        applyTemplate();
      }
    };

    // [B] 포스터 & 초고화질 QR 생성
    function generatePoster() {
      try {
        var color = document.getElementById('color-code').value;
        var title = document.getElementById('doc-title').value;
        var desc = document.getElementById('doc-desc').value;
        var extra = document.getElementById('doc-extra').value.trim();
        var stationInput = document.getElementById('doc-station').value;
        var tpl = document.getElementById('tpl-select').value;

        var telMatch = stationInput.match(/[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}/);
        var tel = telMatch ? telMatch[0] : '';
        var station = stationInput.replace(tel, '').trim();

        var pTitle = document.getElementById('p-title');
        pTitle.innerText = title;
        pTitle.style.color = color;
        document.getElementById('p-desc').innerText = desc;
        document.getElementById('p-station').innerText = stationInput;
        document.getElementById('p-visual').innerHTML = currentCustomVisual;

        var params = new URLSearchParams();
        if (tpl !== 'custom' && Presets[tpl]) {
          params.set('id', tpl);
        } else {
          params.set('t', title);
          params.set('d', desc);
          params.set('c', color);
        }
        params.set('st', station);
        if (tel) params.set('tel', tel);
        if (extra !== '') params.set('m', extra);

        var currentUrl = window.location.origin + window.location.pathname;
        var targetUrl = currentUrl + '?' + params.toString();

        var qrContainer = document.getElementById('poster-qr');
        qrContainer.innerHTML = '';

        new QRCode(qrContainer, {
          text: targetUrl,
          width: 250,
          height: 250,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.L
        });

        var wrapper = document.getElementById('poster-wrapper');
        wrapper.style.display = 'block';
        document.getElementById('url-copy-box').style.display = 'block';
        document.getElementById('export-url').value = targetUrl;
        wrapper.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        alert('생성 오류: ' + err.message);
      }
    }

    function applyTemplate() {
      var type = document.getElementById('tpl-select').value;
      if (Presets[type]) {
        document.getElementById('color-code').value = Presets[type].color;
        document.getElementById('doc-title').value = Presets[type].title;
        document.getElementById('doc-desc').value = Presets[type].desc;
        document.getElementById('doc-extra').value = Presets[type].extra;
        currentCustomVisual = Presets[type].svg;
      }
      document.getElementById('p-visual').innerHTML = currentCustomVisual;
    }

    function loadPreviousData() {
      var inputUrl = document.getElementById('load-url').value;
      try {
        var queryStr = inputUrl.split('?')[1];
        if (!queryStr) {
          alert('올바른 링크 형식이 아닙니다.');
          return;
        }
        var params = new URLSearchParams(queryStr);
        var tplId = params.get('id');
        if (tplId && Presets[tplId]) {
          document.getElementById('tpl-select').value = tplId;
          applyTemplate();
        } else {
          document.getElementById('color-code').value = params.get('c') || '#DC2626';
          document.getElementById('doc-title').value = params.get('t') || '';
          document.getElementById('doc-desc').value = params.get('d') || '';
        }
        if (params.has('m')) {
          document.getElementById('doc-extra').value = params.get('m');
        }
        var st = params.get('st') || '';
        var tel = params.get('tel') || '';
        document.getElementById('doc-station').value = st + (tel ? '  ' + tel : '');
        alert('이전 작성 내용을 성공적으로 불러왔습니다.');
      } catch(e) {
        alert('데이터 복원에 실패했습니다.');
      }
    }
  </script>
</body>
